<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خط الليل - Night Sun</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,255,255,0.8);
        }

        .speedometer {
            font-size: 32px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        /* Controls Area */
        #controls-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 160px;
            height: 160px;
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        .arrow-btn {
            background: #2a3b4c;
            border: 4px solid #1a2530;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 4px 0 #3a4f66, 0 6px 0 #0f1720;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .arrow-btn:active, .arrow-btn.active {
            transform: translateY(4px);
            box-shadow: inset 0 2px 0 #3a4f66, 0 2px 0 #0f1720;
            background: #34495e;
        }

        /* Pixel-style Arrow Shapes */
        .arrow-icon {
            width: 0; height: 0;
            border-style: solid;
        }
        .arrow-up .arrow-icon { border-width: 0 12px 18px 12px; border-color: transparent transparent #00f0ff transparent; }
        .arrow-down .arrow-icon { border-width: 18px 12px 0 12px; border-color: #00f0ff transparent transparent transparent; }
        .arrow-left .arrow-icon { border-width: 12px 18px 12px 0; border-color: transparent #00f0ff transparent transparent; }
        .arrow-right .arrow-icon { border-width: 12px 0 12px 18px; border-color: transparent transparent transparent #00f0ff; }

        .arrow-up { grid-column: 2; grid-row: 1; }
        .arrow-left { grid-column: 1; grid-row: 2; }
        .arrow-down { grid-column: 2; grid-row: 3; }
        .arrow-right { grid-column: 3; grid-row: 2; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="speedometer"><span id="speed">0</span> KM/H</div>
        </div>

        <div id="controls-container">
            <div class="arrow-btn arrow-up" id="btn-up"><div class="arrow-icon"></div></div>
            <div class="arrow-btn arrow-left" id="btn-left"><div class="arrow-icon"></div></div>
            <div class="arrow-btn arrow-down" id="btn-down"><div class="arrow-icon"></div></div>
            <div class="arrow-btn arrow-right" id="btn-right"><div class="arrow-icon"></div></div>
        </div>
    </div>

    <script>
        // Setup Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050811);
        scene.fog = new THREE.FogExp2(0x050811, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting System for High Realism
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Street Lights Simulation
        const lightOrange = new THREE.PointLight(0xffaa44, 2, 50);
        lightOrange.position.set(0, 10, -20);
        scene.add(lightOrange);

        // Realistic Road Environment
        const roadGeometry = new THREE.PlaneGeometry(20, 1000);
        const roadMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111115, 
            roughness: 0.4,
            metalness: 0.1
        });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Procedural High-Detail Sports Car
        const carGroup = new THREE.Group();
        
        // Car Body Material (Metallic Paint)
        const bodyMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xdc143c,
            metalness: 0.9,
            roughness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        // Chassis
        const bodyGeo = new THREE.BoxGeometry(2, 0.6, 4.5);
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMaterial);
        bodyMesh.position.y = 0.5;
        bodyMesh.castShadow = true;
        carGroup.add(bodyMesh);

        // Cabin
        const cabinGeo = new THREE.BoxGeometry(1.6, 0.5, 2);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
        const cabinMesh = new THREE.Mesh(cabinGeo, glassMat);
        cabinMesh.position.set(0, 0.9, -0.2);
        carGroup.add(cabinMesh);

        // Headlights
        const headlightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const hlLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headlightMat);
        hlLeft.position.set(-0.7, 0.5, -2.25);
        const hlRight = hlLeft.clone();
        hlRight.position.x = 0.7;
        carGroup.add(hlLeft, hlRight);

        // Headlight Beams
        const spotLightL = new THREE.SpotLight(0xffffff, 5, 40, Math.PI / 6, 0.5);
        spotLightL.position.set(-0.7, 0.5, -2.2);
        spotLightL.target.position.set(-0.7, 0, -10);
        carGroup.add(spotLightL, spotLightL.target);

        const spotLightR = spotLightL.clone();
        spotLightR.position.x = 0.7;
        spotLightR.target.position.set(0.7, 0, -10);
        carGroup.add(spotLightR, spotLightR.target);

        scene.add(carGroup);

        // Controls Logic
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function bindKey(id, keyName) {
            const el = document.getElementById(id);
            const setKey = (val) => {
                keys[keyName] = val;
                el.classList.toggle('active', val);
            };
            el.addEventListener('mousedown', () => setKey(true));
            el.addEventListener('mouseup', () => setKey(false));
            el.addEventListener('touchstart', (e) => { e.preventDefault(); setKey(true); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); setKey(false); });
        }

        bindKey('btn-up', 'ArrowUp');
        bindKey('btn-down', 'ArrowDown');
        bindKey('btn-left', 'ArrowLeft');
        bindKey('btn-right', 'ArrowRight');

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Physics & Animation Loop
        let speed = 0;
        const maxSpeed = 2.2;
        const accel = 0.03;
        const friction = 0.98;
        let carX = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Driving Physics
            if (keys.ArrowUp) speed = Math.min(speed + accel, maxSpeed);
            if (keys.ArrowDown) speed = Math.max(speed - accel, -maxSpeed * 0.4);

            speed *= friction;

            if (keys.ArrowLeft && Math.abs(speed) > 0.05) carX -= 0.12 * (speed / maxSpeed);
            if (keys.ArrowRight && Math.abs(speed) > 0.05) carX += 0.12 * (speed / maxSpeed);

            // Boundaries
            carX = Math.max(-8, Math.min(8, carX));

            carGroup.position.x = carX;
            carGroup.position.z -= speed;

            // Camera Tracking
            camera.position.x = carGroup.position.x;
            camera.position.y = carGroup.position.y + 3;
            camera.position.z = carGroup.position.z + 8;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 5);

            // Speedometer UI
            document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 120);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
